function hav(a,b){const R=6371,toRad=x=>x*Math.PI/180,dLat=toRad(b.lat-a.lat),dLon=toRad(b.lon-a.lon);const q=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(q));}
function segDistanceKm(p,a,b){ // equirectangular projection, sufficient for ranking
 const lat0=(a.lat+b.lat+p.lat)/3*Math.PI/180, sx=111.32*Math.cos(lat0), sy=110.57;
 const ax=a.lon*sx, ay=a.lat*sy, bx=b.lon*sx, by=b.lat*sy, px=p.lon*sx, py=p.lat*sy;
 const vx=bx-ax,vy=by-ay, wx=px-ax,wy=py-ay, vv=vx*vx+vy*vy; let t=vv?Math.max(0,Math.min(1,(wx*vx+wy*vy)/vv)):0;
 return Math.hypot(px-(ax+t*vx),py-(ay+t*vy));
}

 "불국사":{lat:"35.7892734269",lon:"129.3318475148",display_name:"불국사 · 경상북도 경주시 불국로 385 (진현동)"},

async function geocodeText(q){
 const key=(q||"").trim().replace(/\\s+/g," ");
 const compact=key.replace(/\\s/g,"");
 const builtin=BUILTIN_POI[key] || (compact==="경주불국사"?BUILTIN_POI["불국사"]:null);
 if(builtin){
   const nm=(builtin.display_name||key).split(" · ")[0];
   return [{lat:+builtin.lat,lon:+builtin.lon,name:nm,display:builtin.display_name||key}];
 }
 const queries=[key,key+" 대한민국"];
 const all=[];
 for(const qq of queries){
  try{
   const u='https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&namedetails=1&limit=5&countrycodes=kr&q='+encodeURIComponent(qq);
   const r=await fetch(u,{headers:{'Accept-Language':'ko'}});
   const d=await r.json();
   if(Array.isArray(d)) all.push(...d);
  }catch(e){}
 }
 const seen=new Set(),out=[];
 for(const x of all){
  const k=(+x.lat).toFixed(5)+','+(+x.lon).toFixed(5);
  if(seen.has(k)) continue;
  seen.add(k);
  out.push({lat:+x.lat,lon:+x.lon,name:(x.namedetails&&(x.namedetails['name:ko']||x.namedetails.name))||(x.display_name||key).split(',')[0],display:x.display_name||key});
 }
 return out.slice(0,6);
}

// V45: direction-aware highway rest-area validation.
// Direction words are corridor travel directions, never geographic addresses.
const directionAnchors={
 "서울":{lat:37.5665,lon:126.9780},"인천":{lat:37.4563,lon:126.7052},
 "부산":{lat:35.1796,lon:129.0756},"대구":{lat:35.8714,lon:128.6014},
 "광주":{lat:35.1595,lon:126.8526},"대전":{lat:36.3504,lon:127.3845},
 "울산":{lat:35.5384,lon:129.3114},"춘천":{lat:37.8813,lon:127.7298},
 "양양":{lat:38.0754,lon:128.6191},"강릉":{lat:37.7519,lon:128.8761},
 "속초":{lat:38.2070,lon:128.5918},"삼척":{lat:37.4499,lon:129.1652},
 "포항":{lat:36.0190,lon:129.3435},"순천":{lat:34.9506,lon:127.4872},
 "통영":{lat:34.8544,lon:128.4331},"창원":{lat:35.2280,lon:128.6811},
 "양평":{lat:37.4912,lon:127.4876},"평택":{lat:36.9921,lon:127.1129},
 "제천":{lat:37.1326,lon:128.1910},"청주":{lat:36.6424,lon:127.4890},
 "영덕":{lat:36.4150,lon:129.3656},"천안":{lat:36.8151,lon:127.1139},
 "남이":{lat:36.555,lon:127.420},"하남":{lat:37.5393,lon:127.2148},
 "목포":{lat:34.8118,lon:126.3922},"당진":{lat:36.8896,lon:126.6459},
 "새만금":{lat:35.820,lon:126.480},"전주":{lat:35.8242,lon:127.1480},
 "서부산":{lat:35.116,lon:128.880},"기장":{lat:35.244,lon:129.222}
};
function directionWord(name){
 const m=(name||"").match(/(서울|인천|부산|대구|광주|대전|울산|춘천|양양|강릉|속초|삼척|포항|순천|통영|창원|양평|평택|제천|청주|영덕|천안|남이|하남|목포|당진|새만금|전주|서부산|기장)방향/);
 return m?m[1]:null;
}
function vec(a,b){
 const k=Math.cos(((a.lat+b.lat)/2)*Math.PI/180);
 return {x:(b.lon-a.lon)*k,y:b.lat-a.lat};
}
function cosine(v,w){
 const d=Math.hypot(v.x,v.y)*Math.hypot(w.x,w.y);
 return d?((v.x*w.x+v.y*w.y)/d):0;
}
function directionCompatibility(it,c,destination){
 if(!it.highwayRestArea) return 1;
 const dw=directionWord(it.name);
 const da=dw&&directionAnchors[dw];
 if(!da) return 0; // unknown direction: don't exclude, but no bonus
 // Compare station->trip destination with station->corridor direction city.
 // >0 means broadly the same half-plane; strong negative means opposite carriageway.
 return cosine(vec(c,destination),vec(c,da));
}


// V45 ranking policy:
// 1) highway NACS actually on the base route
// 2) nearest from trip origin / earliest along route
// 3) detour time only as a reference tie-breaker
function routeProgressKm(line, point){
  if(!line || line.length<2 || !point) return {alongKm:1e9, offKm:1e9};
  let cum=0, best={alongKm:1e9,offKm:1e9};
  for(let k=0;k<line.length;k++){
    const rp={lat:line[k][1],lon:line[k][0]};
    const d=hav(point,rp);
    if(d<best.offKm) best={alongKm:cum,offKm:d};
    if(k<line.length-1){
      const np={lat:line[k+1][1],lon:line[k+1][0]};
      cum+=hav(rp,np);
    }
  }
  return best;
}
function rankKey(x){
  // A rest area within 1.5 km of base-route geometry and direction-compatible is "on route".
  const onRoute=!!x.it.highwayRestArea && x.corridor<=1.5 && !x.directionMismatch;
  return {
    onRoute:onRoute?0:1,
    near:Number.isFinite(x.prog)?x.prog:1e9,
    extra:Number.isFinite(x.extraSec)?x.extraSec:1e12
  };
}

  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const progressTimer=setTimeout(()=>{
    if(btn) btn.innerHTML='<span class="rec-spinner"></span>휴게소 비교 중…';

      btn.innerHTML="추천 정렬";
      btn.style.opacity="";
    }
    if(hint) hint.textContent="경로상 휴게소 → 가까운 순 → 우회시간 참고 · 카카오맵 경유 길찾기";

async function recommendSortCore(){
 const statusEl=document.getElementById('status');
 if(!dest){statusEl.textContent="먼저 목적지를 검색해 선택해주세요.";return;}
 if(!myPos){
  statusEl.textContent="현재 위치 확인 중…";
  try{await getMyPos(false)}catch(e){statusEl.textContent="위치 권한을 허용한 뒤 다시 눌러주세요.";return;}
 }
 statusEl.textContent="기본 경로 계산 중…";
 try{
  const baseUrl=`https://router.project-osrm.org/route/v1/driving/${myPos.lon},${myPos.lat};${dest.lon},${dest.lat}?overview=full&geometries=geojson`;
  const base=await fetch(baseUrl).then(r=>r.json());
  if(!base.routes||!base.routes.length)throw new Error("base route");
  const br=base.routes[0], line=br.geometry.coordinates, baseSec=br.duration;
  route=line.map(q=>({lat:q[1],lon:q[0]}));
  if(routeLayer){try{map.removeLayer(routeLayer)}catch(e){}}
  routeLayer=L.geoJSON(br.geometry,{style:{weight:5,opacity:.7}}).addTo(map);

  // 1차 후보 선정만 넓은 경로 주변 범위로 수행.
  // 최종 순위/배제는 실제 '출발→충전소→목적지' 주행시간으로 결정한다.
  let pre=items.map((it,i)=>{
   const c=coords[String(i)];
   const rc=routeCoords[String(i)]||c;
   if(!c || !rc)return null;
   const rp=routeProgressKm(line,rc);
   let md=rp.offKm,prog=rp.alongKm;
   const dirScore=directionCompatibility(it,rc,dest);
   const directionMismatch=!!it.highwayRestArea && !!directionWord(it.name) && dirScore < -0.15;
   return {it,i,c,rc,corridor:md,prog,dirScore,directionMismatch};
  }).filter(Boolean).filter(x=>x.corridor<=35 && x.prog>1);

  pre.sort((a,b)=>a.corridor-b.corridor);
  pre=pre.slice(0,24);
  statusEl.textContent=`후보 ${pre.length}곳 실제 경유시간 계산 중…`;

  const results=[];
  for(let n=0;n<pre.length;n++){
   const x=pre[n];
   try{
    const u=`https://router.project-osrm.org/route/v1/driving/${myPos.lon},${myPos.lat};${x.rc.lon},${x.rc.lat};${dest.lon},${dest.lat}?overview=false&steps=false`;
    const rr=await fetch(u).then(r=>r.json());
    if(!rr.routes||!rr.routes.length)continue;
    const sec=rr.routes[0].duration, extra=Math.max(0,sec-baseSec);
    // 반대편 휴게소처럼 유턴/우회가 큰 후보는 제외.
    if(extra<=20*60)results.push({...x,extraSec:extra,totalSec:sec});
   }catch(e){}
   if(n%4===3)statusEl.textContent=`실제 경유시간 계산 ${n+1}/${pre.length}…`;
  }
  // Remove direction-incompatible carriageways before ranking.
  for(let z=results.length-1;z>=0;z--){if(results[z].directionMismatch)results.splice(z,1);}
  results.sort((a,b)=>{
    const A=rankKey(a), B=rankKey(b);
    if(A.onRoute!==B.onRoute) return A.onRoute-B.onRoute;   // 1. route rest area first
    if(Math.abs(A.near-B.near)>0.2) return A.near-B.near;   // 2. nearest/earliest from origin
    return A.extra-B.extra;                                  // 3. detour time reference only
  });
  lastRecommendedResults=[...results];
  resultSortMode="recommend";
  document.getElementById("resultSort").style.display="block";
  document.querySelectorAll(".sortbtn").forEach(b=>b.classList.toggle("active",b.dataset.sort==="recommend"));
  recommendMode=true;
  renderRecommended(results);
  statusEl.textContent=results.length?`실제 경유 추가시간 기준 ${results.length}곳 추천 · 기본 주행 약 ${Math.round(baseSec/60)}분`:"경유 시 +20분 이내 NACS 충전소가 없습니다.";
 }catch(e){
  console.error(e);
  statusEl.textContent="경로 계산에 실패했습니다. 잠시 후 다시 시도해주세요.";
 }
}
